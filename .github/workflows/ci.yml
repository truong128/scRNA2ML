name: ci

on:
  push:
  pull_request:

jobs:
  lint-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install core dependencies
        run: pip install "numpy>=1.26,<2" scipy "pandas>=2.1,<2.3" scikit-learn==1.5.2 joblib matplotlib pyyaml openpyxl ruff
      - name: Lint
        run: ruff check --select E9,F63,F7,F82 scrna2ml
      - name: Byte-compile
        run: python -m compileall -q scrna2ml
      - name: CLI and configuration
        run: |
          python -m scrna2ml run --help
          python -c "from scrna2ml.config import load_config; c = load_config('config/nsclc.yaml'); assert len(c['datasets']) >= 3"
      - name: Model registry
        run: python -c "from scrna2ml.models import registry; m, u = registry(); print(len(m), 'models;', 'unavailable:', sorted(u))"
